<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试网页</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f3f6fb; color: #17243b; }
      main { max-width: 560px; margin: 24px; padding: 40px; border-radius: 16px; background: white; box-shadow: 0 8px 32px #17243b12; }
      h1 { margin-top: 0; }
      p { line-height: 1.7; }
      button { padding: 12px 20px; border: 0; border-radius: 8px; background: #2563eb; color: white; font: inherit; cursor: pointer; }
      button:focus-visible { outline: 3px solid #17243b; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>你好，世界！</h1>
      <p>这是一个简单的测试网页。基础网页项目已初始化。</p>
      <button type="button" id="test-button">测试交互</button>
      <p id="status" role="status">点击按钮检查网页交互。</p>
    </main>
    <script>
      document.getElementById('test-button').addEventListener('click', () => {
        document.getElementById('status').textContent = '测试成功，网页交互正常！';
      });
    </script>
  </body>
</html>
